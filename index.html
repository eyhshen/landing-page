<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Elaine Shen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,200;1,9..144,300&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --w100: rgba(255,255,255,1.00);
      --w80:  rgba(255,255,255,0.80);
      --w55:  rgba(255,255,255,0.55);
      --w22:  rgba(255,255,255,0.22);
      --w14:  rgba(255,255,255,0.14);
      --w08:  rgba(255,255,255,0.08);
    }

    html, body { height: 100%; }

    body {
      min-height: 100%;
      /* sky gradient: deep blue → cerulean → pale horizon */
      background: linear-gradient(168deg,
        #0B4482 0%,
        #1B6DB5 22%,
        #3A92D0 50%,
        #78BAE0 75%,
        #B8D9EE 100%
      );
      color: var(--w100);
      font-family: 'DM Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding:
        max(60px, env(safe-area-inset-top))
        28px
        max(60px, env(safe-area-inset-bottom));
    }

    /* soft cloud wisps for depth */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 90% 35% at 75% 15%, rgba(255,255,255,0.22) 0%, transparent 65%),
        radial-gradient(ellipse 50% 25% at 15% 55%, rgba(255,255,255,0.12) 0%, transparent 65%),
        radial-gradient(ellipse 70% 20% at 50% 85%, rgba(255,255,255,0.10) 0%, transparent 65%);
    }

    .page {
      width: 100%;
      max-width: 390px;
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ─── PHOTO ─── */
    .photo-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      padding: 2.5px;
      background: rgba(255,255,255,0.55);
      margin-bottom: 20px;
      flex-shrink: 0;
      opacity: 0;
      animation: up 0.75s cubic-bezier(0.22,1,0.36,1) 0.05s forwards;
    }

    .photo-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
    }

    .photo-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* show face, not the top of the cap */
      object-position: center 42%;
      display: block;
    }

    /* ─── NAME ─── */
    .name {
      font-family: 'Fraunces', serif;
      font-style: italic;
      font-weight: 200;
      font-size: 60px;
      line-height: 0.87;
      letter-spacing: -0.03em;
      color: var(--w100);
      text-align: center;
      margin-bottom: 16px;
      opacity: 0;
      animation: up 0.75s cubic-bezier(0.22,1,0.36,1) 0.16s forwards;
    }

    .name .last {
      display: block;
      color: var(--w80);
    }

    /* ─── TAGLINE ─── */
    .tagline {
      font-size: 9.5px;
      font-weight: 300;
      color: var(--w55);
      letter-spacing: 0.13em;
      text-transform: uppercase;
      text-align: center;
      line-height: 2;
      margin-bottom: 36px;
      opacity: 0;
      animation: up 0.75s cubic-bezier(0.22,1,0.36,1) 0.26s forwards;
    }

    .tagline .dot {
      color: var(--w80);
      margin: 0 5px;
    }

    /* ─── FROSTED GLASS LINKS CARD ─── */
    .links-card {
      width: 100%;
      background: var(--w14);
      backdrop-filter: blur(18px) saturate(1.4);
      -webkit-backdrop-filter: blur(18px) saturate(1.4);
      border: 1px solid var(--w22);
      border-radius: 22px;
      overflow: hidden;
      opacity: 0;
      animation: up 0.75s cubic-bezier(0.22,1,0.36,1) 0.36s forwards;
    }

    .link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      text-decoration: none;
      color: var(--w100);
      -webkit-tap-highlight-color: transparent;
      border-bottom: 1px solid var(--w08);
      transition: background 0.12s ease;
    }

    .link:last-child { border-bottom: none; }
    .link:active { background: rgba(255,255,255,0.1); }

    .link-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .icon-box {
      width: 40px;
      height: 40px;
      border-radius: 11px;
      background: rgba(255,255,255,0.20);
      border: 1px solid rgba(255,255,255,0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .icon-box svg { width: 20px; height: 20px; }

    /* image-based icon (野生产品部 logo) */
    .icon-box.icon-img {
      padding: 0;
      overflow: hidden;
      background: none;
      border: none;
    }
    .icon-box.icon-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      display: block;
    }

    /* white box for Bonjour */
    .icon-box.white-bg {
      background: #FFFFFF;
      border-color: rgba(255,255,255,0.5);
      font-size: 22px;
      line-height: 1;
    }

    /* suppress uppercase for Chinese labels */
    .link-label.no-upper { text-transform: none; }

    /* 小红书 icon: CSS-rendered red tile */
    .icon-box.xhs-icon {
      background: #F03254;
      border: none;
      font-size: 8px;
      font-weight: 900;
      color: white;
      font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans CN", sans-serif;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .link-meta {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .link-label {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--w100);
    }

    .link-sub {
      font-size: 10.5px;
      font-weight: 300;
      color: var(--w55);
      letter-spacing: 0.02em;
    }

    .arrow {
      font-size: 14px;
      color: var(--w55);
      flex-shrink: 0;
    }

    @keyframes up {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; opacity: 1 !important; transform: none !important; }
    }
  </style>
</head>
